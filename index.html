<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복지공모 레이더</title>
<style>
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e;
  --line:#e4e3df; --line2:#eeedea;
  --c-child:#2a78d6; --c-senior:#eb6834; --c-disab:#1baf7a; --c-women:#eda100; --c-comm:#e87ba4; --c-vuln:#008300;
  --ai-bg:#eef4fb; --ai-line:#cfe0f2;
  --red:#d03b3b; --orange:#ec835a; --green:#0ca30c;
  --chip:#f2f1ee; --chipOn:#0b0b0b; --chipOnInk:#fcfcfb;
}
html[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
  --line:#2e2e2c; --line2:#242422;
  --c-child:#3987e5; --c-senior:#d95926; --c-disab:#199e70; --c-women:#c98500; --c-comm:#d55181; --c-vuln:#008300;
  --ai-bg:#16202b; --ai-line:#25384c;
  --chip:#242422; --chipOn:#ffffff; --chipOnInk:#0d0d0d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding:0 20px 80px;
}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- header ---------- */
header{padding:38px 0 26px;border-bottom:1px solid var(--line)}
.badge{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  color:var(--c-child);background:var(--ai-bg);border:1px solid var(--ai-line);
  padding:5px 11px;border-radius:100px;letter-spacing:-0.01em;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c-child)}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
h1{font-size:34px;font-weight:750;letter-spacing:-0.035em;margin:14px 0 7px;line-height:1.15}
.sub{font-size:13.5px;color:var(--ink2);letter-spacing:-0.01em}
.themebtn{
  flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--ink2);
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.themebtn:hover{border-color:var(--ink2);color:var(--ink)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 17px}
.tile .n{font-size:31px;font-weight:730;letter-spacing:-0.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.hero .n{color:var(--c-child);font-size:37px}
.tile .l{font-size:12px;color:var(--ink2);margin-top:5px;letter-spacing:-0.01em}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 0;border-top:1px solid var(--line2)}
.search{
  flex:1;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;font-size:13.5px;color:var(--ink);font-family:inherit;
}
.search:focus{outline:none;border-color:var(--c-child)}
.search::placeholder{color:var(--ink2);opacity:.7}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{
  border:none;background:none;color:var(--ink2);font-family:inherit;font-size:12.5px;font-weight:550;
  padding:5px 13px;border-radius:7px;cursor:pointer;transition:.12s;letter-spacing:-0.01em;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid transparent;
  color:var(--ink2);font-size:12.5px;font-weight:550;padding:6px 12px;border-radius:100px;
  cursor:pointer;font-family:inherit;transition:.12s;letter-spacing:-0.01em;white-space:nowrap;
}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--chipOn);color:var(--chipOnInk)}
.chip.hid{border:1px dashed var(--c-child);color:var(--c-child);background:transparent}
.chip.hid.on{background:var(--c-child);border-color:var(--c-child);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cnt{opacity:.6;font-variant-numeric:tabular-nums}
.catrow{display:flex;flex-wrap:wrap;gap:7px;padding:0 0 18px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(348px,1fr));gap:14px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:19px 19px 16px;
  display:flex;flex-direction:column;position:relative;
}
.card.past{opacity:.45}
.dday{
  position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:700;
  padding:4px 9px;border-radius:7px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.dday.urgent{background:var(--red);color:#fff}
.dday.soon{background:color-mix(in srgb,var(--orange) 17%,transparent);color:var(--orange)}
.dday.always{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.dday.far{background:var(--chip);color:var(--ink2)}
.dday.done{background:var(--chip);color:var(--ink2)}
.card h3{font-size:16px;font-weight:680;letter-spacing:-0.028em;line-height:1.38;margin:0 84px 7px 0}
.org{font-size:12.5px;color:var(--ink2);letter-spacing:-0.01em}
.dl{font-size:12.5px;color:var(--ink2);margin-top:3px;letter-spacing:-0.01em}
.dl b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 10px}
.tag{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  background:var(--chip);color:var(--ink2);padding:3px 9px;border-radius:100px;letter-spacing:-0.01em;
}
.tag.hid{background:transparent;border:1px dashed var(--c-child);color:var(--c-child);font-weight:600}
.smry{font-size:13.5px;color:var(--ink2);letter-spacing:-0.012em;line-height:1.62;margin-bottom:12px}
.ai{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:10px;padding:13px 14px;margin-bottom:13px}
.ai .h{font-size:11.5px;font-weight:700;color:var(--c-child);letter-spacing:-0.01em;margin-bottom:9px;display:flex;align-items:center;gap:5px}
.ai .h::before{content:"◈";font-size:10px}
.ai .k{font-size:11.5px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;margin-bottom:3px}
.ai p{font-size:12.5px;color:var(--ink2);line-height:1.6;letter-spacing:-0.012em}
.ai .blk+.blk{margin-top:10px;padding-top:10px;border-top:1px solid var(--ai-line)}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.src{font-size:11.5px;color:var(--ink2);letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{
  flex-shrink:0;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:6px 11px;transition:.12s;letter-spacing:-0.01em;
}
.btn:hover{border-color:var(--c-child);color:var(--c-child)}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11.5px;font-weight:650;color:var(--ink2);letter-spacing:-0.01em;
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 13px;border-bottom:1px solid var(--line2);color:var(--ink2);letter-spacing:-0.012em;vertical-align:top}
tr:last-child td{border-bottom:none}
td.t{color:var(--ink);font-weight:550;min-width:230px}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
tr.past{opacity:.45}
.mini{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-block}
.hidmark{color:var(--c-child);font-weight:700}
td a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
td a:hover{color:var(--c-child);border-color:var(--c-child)}

.empty{padding:60px 20px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- footer ---------- */
footer{margin-top:46px;padding-top:24px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);letter-spacing:-0.012em;line-height:1.75}
footer h4{font-size:12px;font-weight:680;color:var(--ink);margin-bottom:8px;letter-spacing:-0.01em}
.srcs{display:flex;flex-wrap:wrap;gap:5px 0;margin-bottom:18px}
.srcs a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.srcs a:hover{color:var(--c-child);border-color:var(--c-child)}
.srcs span{opacity:.4;padding:0 7px}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:14px}

@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:28px}
  .grid{grid-template-columns:1fr}
  body{padding:0 15px 60px}
}
</style>
</head>

<div class="wrap">

<header>

      <span class="badge">AI가 수집·분류했습니다</span>

      <div class="sub" id="subtitle"></div>
    </div>
    <button class="themebtn" id="themebtn" title="다크모드 전환">◐</button>
  </div>
</header>

    <button data-v="table">표</button>

</div>
<div class="catrow" id="catrow"></div>

<div id="out"></div>

<footer>
  <h4>데이터 출처</h4>
  <div class="srcs" id="srcs"></div>

  <div id="lastrun"></div>
</footer>

</div>

"requirements": "공공기관, 복지시설, 기업, 시군구, 봉사단체 등 교육과 공연을 희망하는 기관이면 신청할 수 있어요. 공고에 일부 제작비 자부담이 있다고 안내돼 있으니 신청 전 정확한 금액을 확인하세요.",
"tips": "마감이 없는 상시 사업이라 다른 공모 마감에 밀려 후순위로 두기 쉬운데, 오히려 그래서 원하는 날짜를 먼저 잡는 기관이 유리해요. 하반기 일정이 채워지기 전에 미리 070-4510-7616~7로 연락해 희망 일정을 선점하세요. 자부담 금액과 포함 범위는 통화할 때 함께 확인하는 게 좋아요.",
"hidden": true,
"source": "정보광장(kpang.kr)",
"url": "https://kpang.kr/2026081205/",
"region": "전국"
}
];
const RUN = "2026-08-20";
const CATS = [
  {n:"아동·청소년", v:"--c-child"},
  {n:"노인",       v:"--c-senior"},
  {n:"장애인",     v:"--c-disab"},
  {n:"여성·가족",  v:"--c-women"},
  {n:"지역사회·공익", v:"--c-comm"},
  {n:"취약계층 일반", v:"--c-vuln"}
];
const catVar = n => (CATS.find(c=>c.n===n)||{v:"--ink2"}).v;
const DOW = ["일","월","화","수","목","금","토"];

/* D-day is computed from the browser's clock at open time */
const today = (()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());})();
function dday(iso){
  if(!iso) return null;
  const p = iso.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  return Math.round((d - today)/86400000);
}
function fmtDate(iso){
  if(!iso) return "상시·수시 접수";
  const p = iso.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  return `${p[0]}년 ${p[1]}월 ${p[2]}일(${DOW[d.getDay()]})`;
}
function ddInfo(iso){
  const n = dday(iso);
  if(n===null) return {cls:"always", txt:"상시"};
  if(n < 0)    return {cls:"done",   txt:"마감됨", past:true};
  if(n === 0)  return {cls:"urgent", txt:"오늘 마감!"};
  if(n <= 10)  return {cls:"urgent", txt:"D-"+n};
  if(n <= 20)  return {cls:"soon",   txt:"D-"+n};
  return {cls:"far", txt:"D-"+n};
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* sort: nearest deadline first, 상시 last, expired at the very end */
const sorted = DATA.slice().sort((a,b)=>{
  const da=dday(a.deadline), db=dday(b.deadline);
  const rank = x => x===null ? 1 : (x<0 ? 2 : 0);
  const ra=rank(da), rb=rank(db);
  if(ra!==rb) return ra-rb;
  if(ra===1) return a.title.localeCompare(b.title,"ko");
  return da-db;
});

const state = {q:"", app:"all", hid:false, cat:null, view:"card"};

function visible(){
  return sorted.filter(x=>{
    if(state.hid && !x.hidden) return false;
    if(state.cat && x.category!==state.cat) return false;
    if(state.app!=="all" && !x.applicant.includes(state.app)) return false;
    if(state.q){
      const hay = [x.title,x.org,x.region,x.category,x.type,x.summary,x.requirements,x.tips,x.source].join(" ").toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
}

function renderStats(){
  const open = sorted.filter(x=>{const n=dday(x.deadline);return n===null||n>=0;});
  document.getElementById("s1").textContent = open.length;
  document.getElementById("s2").textContent = open.filter(x=>{const n=dday(x.deadline);return n!==null&&n<=10;}).length;
  document.getElementById("s3").textContent = open.filter(x=>x.applicant.includes("기관")).length;
  document.getElementById("s4").textContent = open.filter(x=>x.hidden).length;
}

function renderCats(){
  const row = document.getElementById("catrow");
  row.innerHTML = CATS.map(c=>{
    const n = sorted.filter(x=>x.category===c.n && (dday(x.deadline)===null||dday(x.deadline)>=0)).length;
    if(!n) return "";
    return `<button class="chip cat${state.cat===c.n?" on":""}" data-c="${esc(c.n)}">
      <span class="dot" style="background:var(${c.v})"></span>${esc(c.n)}<span class="cnt">${n}</span></button>`;
  }).join("");
  row.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
    state.cat = state.cat===b.dataset.c ? null : b.dataset.c;
    renderCats(); render();
  });
}

function cardHTML(x){
  const d = ddInfo(x.deadline);
  return `<article class="card${d.past?" past":""}">
    <span class="dday ${d.cls}">${d.txt}</span>
    <h3>${esc(x.title)}</h3>
    <div class="org">${esc(x.org)}</div>
    <div class="dl"><b>${esc(fmtDate(x.deadline))}</b>${x.deadlineNote?" · "+esc(x.deadlineNote):""}</div>
    <div class="tags">
      <span class="tag"><span class="dot" style="background:var(${catVar(x.category)})"></span>${esc(x.category)}</span>
      <span class="tag">${esc(x.applicant)} 신청</span>
      <span class="tag">${esc(x.type)}</span>
      ${x.hidden?'<span class="tag hid">◈ 숨은 공모</span>':""}
    </div>
    <p class="smry">${esc(x.summary)}</p>
    <div class="ai">
      <div class="h">AI 분석 · 선정 포인트</div>
      <div class="blk"><div class="k">핵심 요건</div><p>${esc(x.requirements)}</p></div>
      <div class="blk"><div class="k">이렇게 쓰면 유리</div><p>${esc(x.tips)}</p></div>
    </div>
    <div class="foot">
      <span class="src">${esc(x.source)}</span>
      <a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">원문 공고 ↗</a>
    </div>
  </article>`;
}

function tableHTML(list){
  return `<div class="tblwrap"><table>
  <thead><tr><th>마감</th><th>사업명</th><th>주관기관</th><th>대상</th><th>주체</th><th>지원 유형</th><th>지역</th><th>원문</th></tr></thead>
  <tbody>${list.map(x=>{
    const d = ddInfo(x.deadline);
    const bg = d.cls==="urgent" ? "background:var(--red);color:#fff"
             : d.cls==="soon"   ? "background:color-mix(in srgb,var(--orange) 17%,transparent);color:var(--orange)"
             : d.cls==="always" ? "background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)"
             : "background:var(--chip);color:var(--ink2)";
    return `<tr class="${d.past?"past":""}">
      <td class="d"><span class="mini" style="${bg}">${d.txt}</span><br><span style="font-size:11px">${x.deadline?esc(x.deadline):"–"}</span></td>
      <td class="t">${x.hidden?'<span class="hidmark">◈ </span>':""}${esc(x.title)}</td>
      <td>${esc(x.org)}</td>
      <td class="nw"><span class="dot" style="background:var(${catVar(x.category)});display:inline-block;margin-right:5px"></span>${esc(x.category)}</td>
      <td class="nw">${esc(x.applicant)}</td>
      <td>${esc(x.type)}</td>
      <td>${esc(x.region)}</td>
      <td><a href="${esc(x.url)}" target="_blank" rel="noopener">↗</a></td>
    </tr>`;}).join("")}</tbody></table></div>`;
}

function render(){
  const list = visible();
  const out = document.getElementById("out");
  if(!list.length){ out.innerHTML = `<div class="empty">조건에 맞는 공모가 없어요. 필터를 조정해 보세요.</div>`; return; }
  out.innerHTML = state.view==="card"
    ? `<div class="grid">${list.map(cardHTML).join("")}</div>`
    : tableHTML(list);
}

/* ---- controls ---- */
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.querySelectorAll("#segApp button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#segApp button").forEach(o=>o.classList.remove("on"));
  b.classList.add("on"); state.app=b.dataset.v; render();
});
document.querySelectorAll("#segView button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#segView button").forEach(o=>o.classList.remove("on"));
  b.classList.add("on"); state.view=b.dataset.v; render();
});
document.getElementById("hidBtn").onclick = function(){
  state.hid = !state.hid; this.classList.toggle("on", state.hid); render();
};
document.getElementById("themebtn").onclick = function(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  this.textContent = dark ? "◐" : "◑";
};
if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
  document.documentElement.setAttribute("data-theme","dark");
  document.getElementById("themebtn").textContent = "◑";
}

/* ---- header + footer ---- */
(function(){
  const p = RUN.split("-").map(Number);
  const d = new Date(p[0],p[1]-1,p[2]);
  const srcSet = [...new Set(DATA.map(x=>x.source))];
  document.getElementById("subtitle").textContent =
    `대한민국 사회복지 공모·지원사업 브리핑 · ${p[0]}년 ${p[1]}월 ${p[2]}일(${DOW[d.getDay()]}) 기준 · 출처 ${srcSet.length}곳`;

  const seen = new Map();
  DATA.forEach(x=>{ if(!seen.has(x.source)) seen.set(x.source, x.url); });
  document.getElementById("srcs").innerHTML =
    [...seen].map(([name,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}</a>`)
      .join('<span>·</span>');
  document.getElementById("lastrun").textContent =
    `마지막 수집일: ${p[0]}년 ${p[1]}월 ${p[2]}일 · 총 ${DATA.length}건`;
})();

renderStats(); renderCats(); render();
</script>
</body>
</html>
